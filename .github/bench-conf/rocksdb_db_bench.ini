# Purpose: RocksDB compression_per_level corresponds to ToplingDB
# level_writers: lightweight upper levels, heavyweight bottom.
# RocksDB: no compression or Snappy on upper SSTs, Zstd on L6.
# RocksDB compression_per_level is compared with ToplingDB's zipkeyvalue
# variant: its L6 writer is ZipKeyValue, while the zipkeyonly variant uses
# ZipKeyOnly at L6.
#
# Upstream db_bench has no compression_per_level flag, so this benchmark
# loads the setting from an OPTIONS file.
# Ladder: L0 none, L1-L5 snappy, L6 zstd.
# zipkey* yaml lists the same compression_per_level; that is coincidental.
# Those YAML keys exist so users can configure native RocksDB CFOptions
# through ToplingDB's YAML.
# ToplingDB db_bench CI does not use yaml compression_per_level
# (it uses level_writers).
[Version]
  rocksdb_version=8.10.2
  options_file_version=1.1

[DBOptions]
  # db_bench flag default is true; Options() default is false.
  dump_malloc_stats=true
  # Keep db_bench flag defaults instead of the differing Options() defaults.
  delayed_write_rate=8388608
  enable_pipelined_write=true
  table_cache_numshardbits=4

[CFOptions "default"]
  # db_bench flag default and zipkey* yaml are false; Options() default is true.
  # Must pin: otherwise compression_per_level no longer maps to L0..L6.
  level_compaction_dynamic_level_bytes=false
  compression_per_level=kNoCompression:kSnappyCompression:kSnappyCompression:kSnappyCompression:kSnappyCompression:kSnappyCompression:kZSTD

[TableOptions/BlockBasedTable "default"]
  # Keep db_bench flag defaults instead of the differing table defaults.
  index_shortening=kShortenSeparatorsAndSuccessor
  pin_top_level_index_and_filter=false
